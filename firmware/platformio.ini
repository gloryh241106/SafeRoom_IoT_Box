; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pin the platform so every team member builds with the same ESP32 core.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

; Serial settings are kept here so upload/monitor behavior is reproducible.
monitor_speed = 115200
upload_speed = 921600

; Pin WiFiManager because provisioning uses its tested non-blocking flow.
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    tzapu/WiFiManager@2.0.17
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
